<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FootprintX | Analytics</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #0d1117; color: #c9d1d9; font-family: sans-serif; }
        .risk-card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 2rem; }
        .score-circle { 
            width: 150px; height: 150px; border-radius: 50%; border: 10px solid;
            display: flex; align-items: center; justify-content: center;
            font-size: 40px; font-weight: bold; margin: 0 auto;
        }
        .border-danger { border-color: #f85149 !important; color: #f85149; }
        .border-warning { border-color: #d29922 !important; color: #d29922; }
        .border-success { border-color: #238636 !important; color: #238636; }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-10">
                <div class="risk-card">
                    <div class="row align-items-center">
                        <div class="col-md-4 text-center">
                            <div class="score-circle border-{{ twin.color }}">
                                {{ score }}
                            </div>
                            <h4 class="mt-3">HPBS Score</h4>
                        </div>
                        <div class="col-md-8">
                            <h2 class="text-{{ twin.color }}">Digital Twin: {{ twin.status }}</h2>
                            <p>Predicted Vector: <strong>{{ twin.vector }}</strong></p>
                            <hr style="background-color: #30363d;">
                            <p>Target Identity: <strong>{{ user.name }}</strong></p>
                            <p>Contact: <strong>{{ user.email }}</strong></p>
                            <div class="p-3 bg-dark rounded border border-secondary mb-4">
                                <small class="text-info d-block mb-1">ADVICE:</small>
                                <span>{{ advice }}</span>
                            </div>
                            <a href="{{ url_for('download_report', name=user.name, score=score) }}" 
                               class="btn btn-success w-100 py-3 fw-bold">
                               Download Full PDF Investor Report
                            </a>
                        </div>
                    </div>
                </div>
                <div class="text-center mt-4">
                    <a href="/" class="text-secondary">← Start New Scan</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
